<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>CROAK</title>
    <style>
      /* Palette roles only - PROMPT.md section 2. */
      :root {
        --haze-sky: #cde8ea;
        --dungeon-dark: #22283f;
        --gold: #f2c14e;
        --hero-body: #6fbf4b;
        --hero-belly: #f2e8c9;
        --tongue: #f4846c;
        --stone-shade: #b08d6e;
        --ink: #3a2e28;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--dungeon-dark);
        /* No default browser fonts in the build - section 9 rule 12. */
        font-family: ui-rounded, 'Hiragino Maru Gothic ProN', 'Quicksand',
          'Trebuchet MS', system-ui, sans-serif;
        color: var(--hero-belly);
        -webkit-font-smoothing: antialiased;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        user-select: none;
      }
      /* Boot veil: not a landing page - it self-dismisses on first frame. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--dungeon-dark);
        color: var(--haze-sky);
        letter-spacing: 0.35em;
        font-size: 13px;
        text-transform: uppercase;
        transition: opacity 380ms ease-out;
        z-index: 10;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="boot">croak</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
